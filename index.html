><button class="btn btn-full" style="margin-top:16px" data-finish="${date}" ${isFuture?'disabled':''}>${entry.finished?'✓ Treino finalizado · reabrir':'Concluir treino +80 XP'}</button><p class="sec-note" style="margin:10px 0 0">Marque pelo menos 75% das séries para concluir. Treinos parciais também são parte do progresso; altere a programação quando necessário.</p></div></div><div class="stack"><section class="panel"><h2>Sua estratégia</h2><div class="task-row"><div class="task-main"><div class="task-ico">${icon('target',19)}</div><div><div class="task-title">Progressão dupla</div><div class="task-sub">Primeiro alcance o topo da faixa de repetições. Depois aumente a carga.</div></div></div></div><div class="task-row"><div class="task-main"><div class="task-ico">${icon('clock',19)}</div><div><div class="task-title">Descanso inteligente</div><div class="task-sub">Descanse mais nos compostos, sem sacrificar a execução.</div></div></div></div><div class="task-row"><div class="task-main"><div class="task-ico">${icon('shield',19)}</div><div><div class="task-title">Recuperação</div><div class="task-sub">Se acumular fadiga ou dor, reduza o volume e busque orientação.</div></div></div></div></section><section class="panel"><div class="flex-between"><h2>Nota do treino</h2><span class="pill">Opcional</span></div><textarea class="input" data-note="${date}" style="margin-top:12px;min-height:95px;resize:vertical" placeholder="Ex.: 2 reps em reserva; melhorei no supino..." ${isFuture?'disabled':''}>${safe(entry.note||'')}</textarea><p class="sec-note" style="margin:8px 0 0">A anotação é salva ao sair do campo.</p></section>${entry.finished?`<div class="note">🏆 Treino concluído! Você recebeu XP por este dia. Editar as séries não duplica a recompensa.</div>`:''}<section class="panel"><h2>Cardio complementar</h2><p class="small-muted" style="margin-top:8px">${['Bicicleta leve 20 min','Sem cardio obrigatório','Caminhada 25 min','Bicicleta 25 min','Sem cardio obrigatório'][idx]}. Ajus function screenFood(){let d=ui.foodDate,tot=mealTotal(d),ms=db.meals[d]||{},ex=db.extras[d]||[],isFuture=d>dateKey();return `<div class="page-head"><div><div class="eyebrow">PLANO NUTRICIONAL · REGISTRO DIÁRIO</div><h1>Sua alimentação<span style="color:var(--lime)">.</span></h1><p class="subtitle">Refeições simples, proteína suficiente e consistência.</p></div><span class="tag">${icon('utensils',14)} ${nfmt(db.profile.calories)} KCAL / DIA</span></div><div class="panel" style="margin-bottom:15px"><div class="flex-between"><button class="circle-btn" data-foodmove="-1" aria-label="Dia anterior">‹</button><div style="text-align:center"><b>${fmtDate(d,{weekday:'long',day:'numeric',month:'long'})}</b><div class="small-muted">${d===dateKey()?'Hoje':'Registro de refeições'}</div></div><button class="circle-btn" data-foodmove="1" aria-label="Dia seguinte">›</button></div></div><section class="panel" style="margin-bottom:15px"><div class="section-head"><div><h2>Resumo nutricional</h2><div class="small-muted">Estimativa das refeições registradas, não medição automática</div></div><span class="pill ${tot.kcal>=db.profile.calories*.85?'good':'blue'}">${nfmt(tot.kcal)} / ${nfmt(db.profile.calories)} kcal</span></div><div class="progressbar"><div style="width:${percent(tot.kcal,db.profile.calories)}%"></div></div><div class="macro-grid" style="margin-top:15px">${[['Proteínas',tot.p,db.profile.protein,'#c5fa76'],['Carboidratos',tot.c,db.profile.carbs,'#84c8fb'],['Gorduras',tot.f,db.profile.fats,'#ffc17d']].map(a=>`<div class="macro"><div class="sub">${a[0]}</div><div class="val num">${nfmt(a[1])}<span style="font-size:11px;color:var(--muted)">/${nfmt(a[2])}g</span></div><div class="bar"><div style="width:${percent(a[1],a[2])}%;background:${a[3]}"></div></div></div>`).join('')}</div><p class="sec-note" style="margin:13px 0 0">Marque somente as refeições que realmente consumiu. Se trocou algum alimento, registre um item avulso e desmarque a refeição original para evitar duplicidade. ara calor e exercícios.</div></div></div></div><div class="task-row"><div class="task-main"><div class="task-ico">${icon('star',18)}</div><div><div class="task-title">Flexibilidade</div><div class="task-sub">Seu plano é uma referência, não um conjunto de regras rígidas.</div></div></div></div></section></div>`}
function weightChart(){let all=(db.weights||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));if(!all.length)return '<div class="empty">Sem registros de peso.</div>';let w=640,h=210,padX=43,padTop=17,padBottom=36, bottom=h-padBottom, min=Math.min(db.profile.target,...all.map(a=>a.kg))-2,max=Math.max(db.profile.initial,...all.map(a=>a.kg))+2,sy=v=>bottom-(v-min)/(max-min)*(bottom-padTop);let d0=fromKey(db.profile.start).getTime(),d1=Math.max(fromKey(db.profile.deadline).getTime(),fromKey(dateKey()).getTime(),...all.map(a=>fromKey(a.date).getTime()));if(d1<=d0)d1=d0+864e5;let sx=s=>padX+(fromKey(s).getTime()-d0)/(d1-d0)*(w-padX-15);let samples=Array.from({length:4},(_,i)=>min+(max-min)*i/3);let poly=all.map(a=>`${sx(a.date).toFixed(2)},${sy(a.kg).toFixed(2)}`).join(' ');let goalx=sx(db.profile.deadline),goalY=sy(db.profile.target);return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Gráfico de evolução do peso"><defs><linearGradient id="chart-fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c5fa76" stop-opacity=".18"/><stop offset="1" stop-color="#c5fa76" stop-opacity="0"/></linearGradient></defs>${samples.map(v=>`<line class="chart-grid" x1="${padX}" y1="${sy(v)}" x2="${w-12}" y2="${sy(v)}"/><text class="chart-axis" x="3" y="${sy(v)+4}">${nfmt(v,0)}kg</text>`).join('')}<line x1="${padX}" y1="${goalY}" x2="${w-12}" y2="${goalY}" stroke="#84c8fb" stroke-width="1" stroke-dasharray="5,5" opacity=".7"/><text x="${w-10}" y="${goalY-5}" fill="#84c8fb" font-size="11" text-anchor="end">meta ${db.profile.target} kg</text>${all.length>1?`<polygon points="${sx(all[0].date)},${bottom} ${poly} ${sx(all.at(-1).date)},${bottom}" fill="url(#chart-fade)"/><polyline points="${poly}" fill="none" stroke="#c5fa76" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`:''}${all.map(a=>`<circle cx="${sx(a.date)}" cy="${sy(a.kg)}" r="5" fill="#c5fa76" stroke="#0c1210" stroke-width="2"><title>${fmtDate(a.date)}: ${nfmt(a.kg,1)} kg</title></circle>`).join('')}<text class="chart-label" x="${padX}" y="${h-8}">${fmtDate(db.profile.start,{month:'short',year:'numeric'})}</text><text class="chart-label" x="${w-15}" y="${h-8}" text-anchor="end">${fmtDate(db.profile.deadline,{month:'short',year:'numeric'})}</text></svg>`}
function screenProgress(){let w=latestWeight(),lost=db.profile.initial-w,goalDelta=db.profile.initial-db.profile.target,records=(db.weights||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)),weeks=Math.round((fromKey(dateKey())-fromKey(db.profile.start))/864e5/7),seven=[];for(let i=0;i<7;i++){let d=addDays(dateKey(),-i);seven.push(d)}return `<div class="page-head"><div><div class="eyebrow">MELHOR QUE ONTEM</div><h1>Sua evolução<span style="color:var(--lime)">.</span></h1><p class="subtitle">Resultados também são força, saúde, hábitos e disposição.</p></div><button class="btn" data-modal="weight">${icon('plus',15)} Registrar peso</button></div><div class="three-col" style="margin-bottom:15px"><div class="panel stat-card"><div class="stat-label">Peso atual</div><div class="stat-value">${nfmt(w,1)} <span style="font-size:13px;color:var(--muted)">kg</span></div><div class="stat-foot">Último registro</div></div><div class="panel stat-card"><div class="stat-label">Variação desde o início</div><div class="stat-value" style="color:var(--lime)">${lost>0?'−':lost<0?'+':''}${nfmt(Math.abs(lost),1)} <span style="font-size:13px">kg</span></div><div class="stat-foot">Ponto inicial: ${nfmt(db.profile.initial)} kg</div></div><div class="panel stat-card"><div class="stat-label">Meta pessoal</div><div class="stat-value">${nfmt(db.profile.target)} <span style="font-size:13px;color:var(--muted)">kg</span></div><div class="stat-foot">Referência: ${fmtDate(db.profile.deadline,{month:'short',year:'numeric'})}</div></div></div><div class="two-col"><div class="stack"><section class="panel"><div class="section-head"><h2>Gráfico de peso</h2><span class="pill">Check-ins</span></div>${weightChart()}<p class="sec-note" style="margin:0">A linha de 85 kg é uma referência. O ritmo de perda pode variar; não é uma previsão.</p></section><section class="panel"><div class="section-head"><h2>Histórico de pesagens</h2><span class="small-muted">${records.length} registros</span></div>${records.slice(0,12).map((r,i)=>`<div class="task-row"><div class="task-main"><div class="task-ico">${icon('target',16)}</div><div><div class="task-title">${nfmt(r.kg,1)} kg</div><div class="task-sub">${fmtDate(r.date,{day:'2-digit',month:'long',year:'numeric'})}${r.waist?` · Cintura ${nfmt(r.waist,1)} cm`:''}</div></div></div><span class="pill ${i===0?'good':''}">${i===0?'Atual':'Registrado'}</span></div>`).join('')}</section></div><div class="stack"><section class="panel"><h2>Progresso até a meta</h2><div class="stat-value">${nfmt(Math.max(0,lost),1)} <span style="font-size:13px;color:var(--muted)">de ${nfmt(goalDelta)} kg</span></div><div class="progressbar" style="height:12px"><div style="width:${percent(Math.max(0,lost),goalDelta)}%"></div></div><div class="flex-between" style="margin-top:13px"><span class="small-muted">${nfmt(percent(Math.max(0,lost),goalDelta),1)}% do caminho</span><span class="small-muted">${nfmt(Math.max(0,w-db.profile.target),1)} kg restantes</span></div></section><section class="panel"><h2>Além da balança</h2><p class="small-muted" style="margin-top:11px">Observe também a cintura, a progressão de cargas e como você se sente. Em recomposição corporal, o peso pode cair mais lentamente que a gordura.</p><div class="mini-card"><div class="task-title">🗓️ A cada duas semanas</div><div class="task-sub" style="margin-top:5px">Meça a cintura pela manhã e compare condições semelhantes.</div></div><div class="mini-card" style="margin-top:9px"><div class="task-title">🏋️ Em cada sessão</div><div class="task-sub" style="margin-top:5px">Registre as cargas e repetições para acompanhar a evolução da força.</div></div></section><section class="panel"><h2>Pequenas vitórias</h2><div class="flex-between" style="margin-top:12px"><span class="small-muted">Treinos concluídos</span><b>${finishedCount()}</b></div><div class="flex-between" style="margin-top:12px"><span class="small-muted">Conquistas desbloqueadas</span><b>${achievements().filter(x=>x[3]).length}/8</b></div><div class="flex-between" style="margin-top:12px"><span class="small-muted">Semanas desde início</span><b>${Math.max(0,weeks)}</b></div></section></div></div>`}
function screenProfile(x,level,lvPct){let wins=achievements();return `<div class="page-head"><div><div class="eyebrow">SUA JORNADA · SUAS REGRAS</div><h1>Meu perfil<span style="color:var(--lime)">.</span></h1><p class="subtitle">Ajuste metas, acompanhe conquistas e proteja seus dados.</p></div><button class="btn btn-quiet" data-modal="settings">${icon('edit',15)} Editar metas</button></div><div class="two-col"><div class="stack"><section class="panel card-accent"><div class="flex-between"><div class="flex-between"><div class="avatar" style="width:54px;height:54px;font-size:21px">${safe(db.profile.name.slice(0,1).toUpperCase())}</div><div><h2>${safe(db.profile.name)}</h2><div class="small-muted">Atleta em evolução</div></div></div><span class="tag">${icon('bolt',14)} NÍVEL ${level}</span></div><div class="flex-between" style="margin-top:20px"><b>${nfmt(x)} XP acumulados</b><span class="small-muted">Faltam ${250-x%250} XP</span></div><div class="progressbar"><div style="width:${lvPct}%"></div></div></section><section class="panel"><div class="section-head"><h2>Suas conquistas</h2><span class="pill">${wins.filter(x=>x[3]).length} / ${wins.length}</span></div><div class="achievement-grid">${wins.map(a=>`<div class="achievement ${a[3]?'':'locked'}"><div class="achievement-emoji">${a[0]}</div><div class="achievement-title">${a[1]}</div><div class="achievement-description">${a[2]}</div>${a[3]?'<span class="pill good" style="margin-top:8px">Desbloqueada</span>':''}</div>`).join('')}</div></section></div><div class="stack"><section class="panel"><h2>Seu plano</h2>${[['Peso inicial',nfmt(db.profile.initial)+' kg'],['Meta',nfmt(db.profile.target)+' kg'],['Calorias',nfmt(db.profile.calories)+' kcal'],['Proteína',nfmt(db.profile.protein)+' g'],['Carboidratos',nfmt(db.profile.carbs)+' g'],['Gorduras',nfmt(db.profile.fats)+' g'],['Treino','5 dias de musculação'],['Cardio','Progressivo']].map(z=>`<div class="task-row"><span class="small-muted">${z[0]}</span><b>${z[1]}</b></div>`).j else if(kind==='habits')body=`<h2>Movimento de hoje</h2><p>Registre sua atividade real. Caminhadas leves também contam para sua rotina.</p><form id="form-habits"><div class="field"><label>Passos hoje</label><input class="input" name="steps" type="number" min="0" max="100000" value="${h.steps||0}"/></div><div class="field"><label>Cardio realizado (minutos)</label><input class="input" name="cardio" type="number" min="0" max="600" value="${h.cardio||0}"/></div><div class="field"><label>Água (ml) · opcional</label><input class="input" name="water" type="number" min="0" max="10000" step="100" value="${h.water||0}"/></div><div class="form-actions"><button type="button" class="btn btn-ghost" data-close="1">Cancelar</button><button type="submit" class="btn">Salvar atividade</button></div></form>`;
else if(kind==='food')body=`<h2>Registrar alimento avulso</h2><p>Informe os valores para a porção realmente consumida, usando o rótulo ou uma tabela de composição confiável. É um registro manual.</p><form id="form-food"><div class="field"><label>Nome do alimento / porção</label><input class="input" name="name" required maxlength="75" placeholder="Ex.: 1 sanduíche caseiro"/></div><div class="profile-grid"><div class="field"><label>Calorias (kcal)</label><input class="input" name="kcal" type="number" min="0" max="6000" required/></div><div class="field"><label>Proteína (g)</label><input class="input" name="p" type="number" step="0.1" min="0" max="300" required/></div><div class="field"><label>Carboidratos (g)</label><input class="input" name="c" type="number" step="0.1" min="0" max="500" required/></div><div class="field"><label>Gorduras (g)</label><input class="input" name="f" type="number" step="0.1" min="0" max="300" required/></div></div><div class="form-actions"><button type="button" class="btn btn-ghost" data-close="1">Cancelar</button><button class="btn" type="submit">Adicionar item</button></div></form>`;
else if(kind==='settings')body=`<h2>Metas e preferências</h2><p>Seus números são pontos de partida. Você pode ajustá-los conforme orientação profissional e sua evolução.</p><form id="form-settings"><div class="field"><label>Como quer ser chamado?</label><input class="input" name="name" maxlength="30" required value="${safe(p.name)}"/></div><div class="profile-grid"><div class="field"><label>Peso inicial (kg)</label><input class="input" name="initial" type="number" min="35" max="350" step="0.1" required value="${p.initial}"/></div><div class="field"><label>Peso desejado (kg)</label><input class="input" name="target" type="number" min="35" max="300" step="0.1" required value="${p.target}"/></div><div class="field"><label>Calorias diárias (kcal)</label><input class="input" name="calories" type="number" min="1000" max="6000" step="10" required value="${p.calories}"/></div><div class="field"><label>Proteína (g)</label><input class="input" name="protein" type="number" min="20" max="350" required value="${p.protein}"/></div><div class="field"><label>Carboidratos (g)</label><input class="input" name="carbs" type="number" min="20" max="650" required value="${p.carbs}"/></div><div class="field"><label>Gorduras (g)</label><input class="input" name="fats" type="number" min="20" max="250" required value="${p.fats}"/></div><div class="field"><label>Meta de passos</label><input class="input" name="stepsGoal" type="number" min="1000" max="30000" step="500" required value="${p.stepsGoal}"/></div><div class="field"><label>Data de referência da meta</label><input class="input" name="deadline" type="date" required value="${p.deadline}"/></div></div><div class="form-actions"><button type="button" class="btn btn-ghost" data-close="1">Cancelar</button><button class="btn" type="submit">Salvar alterações</button></div></form>`;
else if(kind==='reset')body=`<h2>Apagar os dados locais?</h2><p>Isso remove todo o histórico de treinos, refeições, evolução de peso e conquistas deste navegador. Exporte seu backup antes, se quiser guardá-lo.</p><div class="form-actions"><button class="btn btn-ghost" data-close="1">Cancelar</button><button class="btn btn-danger" data-reset-confirm="1">Apagar tudo</button></div>`;
return `<div class="modal-cover" id="modal-cover" role="dialog" aria-modal="true" aria-label="Janela de edição"><div class="modal"><div class="flex-between" style="margin-bottom:7px"><span class="tag">PROJETO 85</span><button class="circle-btn" aria-label="Fechar" data-close="1">×</button></div>${body}</div></div>`}
function openModal(k){document.getElementById('modal-root').innerHTML=modalHtml(k);document.querySelector('.modal .input')?.focus()}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
function recordSet(date,id,i,field,value){if(date>dateKey())return;let e=db.workouts[date]??={sets:{},finished:false};let arr=e.sets[id]??=[];arr[i]??={kg:'',reps:'',done:false};if(field==='done')arr[i].done=!!value;else arr[i][field]=value;persist()}
document.addEventListener('click',e=>{let t=e.target.closest('button');if(!t)return;if(t.dataset.nav){navTo(t.dataset.nav);return}if(t.dataset.modal){openModal(t.dataset.modal);return}if(t.dataset.close){closeModal();return}if(t.dataset.week){ui.workoutDate=addDays(ui.workoutDate,Number(t.dataset.week));render();return}if(t.dataset.workdate){ui.workoutDate=t.dataset.workdate;render();return}if(t.dataset.foodmove){ui.foodDate=addDays(ui.foodDate,Number(t.dataset.foodmove));render();return}if(t.dataset.finish){let date=t.dataset.finish;if(date>dateKey())return;let idx=dayIndex(date);if(idx<0)return;let w=WORKOUTS[idx];let ent=db.workouts[date]??={sets:{},finished:false};if(ent.finished){ent.finished=false;persist();toast('Treino reaberto para edição');render();return}let total=w.exercises.reduce((a,z)=>a+z[2],0),done=w.exercises.reduce((a,z)=>a+(ent.sets[z[0]]||[]).filter(z=>z?.done).length,0);if(done<Math.ceil(total*.75)){toast(`Marque pelo menos ${Math.ceil(total*.75)} séries feitas para concluir.`, 'error');return}ent.finished=true;ent.completedAt=new Date().toISOString();persist();render();toast('Treino concluído! +80 XP 💪');return}if(t.dataset.removefood!==undefined){let ex=db.extras[ui.foodDate]||[];ex.splice(Number(t.dataset.removefood),1);persist();render();toast('Alimento removido');return}if(t.dataset.export){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`projeto85-backup-${dateKey()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('Backup exportado');return}if(t.dataset.import){document.getElementById('import-file')?.click();return}if(t.dataset.resetConfirm){localStorage.removeItem(STORE_KEY);db=initialData();closeModal();navTo('home');persist();toast('Dados locais reiniciados');return}});
document.addEventListener('change',e=>{let t=e.target;if(t.dataset.checkset){recordSet(ui.workoutDate,t.dataset.checkset,Number(t.dataset.index),'done',t.checked);render();return}if(t.dataset.set){if(t.value!==''&&(!Number.isFinite(Number(t.value))||Number(t.value)<0)){t.value='';toast('Use um valor não negativo','error')}recordSet(ui.workoutDate,t.dataset.set,Number(t.dataset.index),t.dataset.field,t.value);return}if(t.dataset.meal){let d=ui.foodDate;if(d>dateKey())return;db.meals[d]??={};db.meals[d][t.dataset.meal]=t.checked;persist();render();toast(t.checked?'Refeição registrada! +10 XP 🍽️':'Registro da refeição desfeito');return}if(t.dataset.note){db.workouts[t.dataset.note]??={sets:{},finished:false};db.workouts[t.dataset.note].note=t.value.slice(0,500);persist();return}if(t.id==='import-file'){let f=t.files?.[0];if(!f)return;if(f.size>3_000_000){toast('Arquivo de backup muito grande','error');return}f.text().then(text=>{try{let n=JSON.parse(text);if(n.version!==1||!n.profile||!n.workouts||!Array.isArray(n.weights)||!n.meals||!n.habits||!n.extras)throw Error('Formato não reconhecido');let needed=['initial','target','calories','protein','carbs','fats','stepsGoal','start','deadline','name'];if(!needed.every(k=>n.profile[k]!==undefined))throw Error('Perfil incompleto');if(!Number.isFinite(Number(n.profile.initial))||Number(n.profile.initial)<=0||!Number.isFinite(Number(n.profile.target))||Number(n.profile.target)<=0)throw Error('Peso inválido');db=n;persist();render();toast('Backup importado!')}catch(err){toast('Falha ao importar: '+err.message,'error')}});return}});
document.addEventListener('submit',e=>{let form=e.target;if(!form.id.startsWith('form-'))return;e.preventDefault();let f=new FormData(form),get=k=>num(f.get(k));if(form.id==='form-weight'){let kg=get('kg'),date=f.get('date');if(!Number.isFinite(kg)||kg<30||kg>350||date>dateKey()){toast('Confira os dados da pesagem','error');return}let waist=f.get('waist')?get('waist'):null;db.weights=db.weights.filter(w=>w.date!==date);db.weights.push({date,kg,waist});db.weights.sort((a,b)=>a.date.localeCompare(b.date));persist();closeModal();render();toast('Pesagem registrada! ⚖️');return}if(form.id==='form-habits'){let values=['steps','cardio','water'].map(get);if(values.some(x=>!Number.isFinite(x)||x<0)){toast('Confira as quantidades','error');return}db.habits[dateKey()]={steps:values[0],cardio:values[1],water:values[2]};persist();closeModal();render();toast('Atividade atualizada!');return}if(form.id==='form-food'){let name=f.get('name').trim(),vals=['kcal','p','c','f'].map(get);if(!name||vals.some(x=>!Number.isFinite(x)||x<0)){toast('Preencha os valores corretamente','error');return}db.extras[ui.foodDate]??=[];db.extras[ui.foodDate].push({name,kcal:vals[0],p:vals[1],c:vals[2],f:vals[3]});persist();closeModal();render();toast('Alimento registrado!');return}if(form.id==='form-settings'){let fields=['initial','target','calories','protein','carbs','fats','stepsGoal'],o={name:String(f.get('name')).trim().slice(0,30),deadline:f.get('deadline')};fields.forEach(k=>o[k]=get(k));if(!o.name||fields.some(k=>!Number.isFinite(o[k])||o[k]<=0)||!/^\d{4}-\d{2}-\d{2}$/.test(o.deadline)){toast('Confira os valores das metas','error');return}Object.assign(db.profile,o);persist();closeModal();render();toast('Metas atualizadas!');return}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.getElementById('modal-root').addEventListener('click',e=>{if(e.target.id==='modal-cover')closeModal()});
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
render();persist();
</script>
</body>
